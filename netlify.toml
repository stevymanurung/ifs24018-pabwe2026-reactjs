[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA: semua rute (mis. /auth/login, /lost-founds/1) harus dilayani index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Aset ber-hash dari Vite aman di-cache lama
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
